name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Apache-2.0 header on every source file
        run: |
          missing=$(grep -L 'SPDX-License-Identifier: Apache-2.0' $(git ls-files '*.py') || true)
          [ -z "$missing" ] || { echo "missing SPDX header: $missing"; exit 1; }
      - run: docker build -q -t imatra-ocpp:ci .
