[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imatra-ocpp"
version = "0.1.0.dev0"
description = "OCPP 2.1 / 2.0.1 charging-station client for Imatra ISO 15118-2 devices"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "ocpp==2.1.0",
  "websockets>=14,<16",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
